
[env:seeed_xiao_esp32s3]
platform = espressif32@54.3.20
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    jgromes/RadioLib@6.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=0

    ; --------------------------------------------------
    ; RadioLib Debugging
    ; --------------------------------------------------
    ; Uncomment these definitions only when manually
    ; enabling RadioLib debugging.
    ;
    ; -DRADIOLIB_DEBUG
    ; -DRADIOLIB_DEBUG_BASIC
    ; -DRADIOLIB_DEBUG_PROTOCOL
